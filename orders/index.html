<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>سجل الطلبات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0b1d4d;
      color: white;
      margin: 0;
      padding-top: 100px;
      padding-bottom: 120px;
    }

    header, footer {
      background: linear-gradient(to right, purple, #00008b);
      padding: 20px;
      display: flex;
      align-items: center;
      width: 100%;
      position: fixed;
      z-index: 1000;
    }

    header { top: 0; justify-content: center; }
    footer { bottom: 0; flex-direction: column; justify-content: center; text-align: center; }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1000px;
      padding-inline: 20px;
      gap: 15px;
    }

    .logo img { width: 90px; height: auto; }

    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background-color: white; border-radius: 20px; padding: 5px 10px; min-width: 150px; flex-shrink: 0;
    }

    .search-bar i { color: #5c0fa8; font-size: 16px; }
    .search-bar input { border: none; outline: none; border-radius: 20px; padding: 8px; max-width: 180px; width: 100%; font-size: 14px; }

    .purchase-progress-container { display: flex; align-items: center; gap: 5px; font-size: 12px; color: white; }
    .progress-bar { background-color: #333; border-radius: 10px; width: 120px; height: 12px; overflow: hidden; }
    .progress-fill { background-color: #5c0fa8; width: 0%; height: 100%; border-radius: 10px; transition: width 0.5s ease; }
    #purchaseAmount { min-width: 40px; text-align: right; }

    .menu-toggle { font-size: 24px; color: yellow; cursor: pointer; margin-left: auto; }

    #sideMenu {
      position: fixed; top: 0; right: -300px; width: 280px; max-width: 100%; height: 100%;
      background-color: #1a2f5e; color: white; padding: 20px; z-index: 3000;
      transition: right 0.3s ease; box-shadow: -2px 0 10px rgba(0,0,0,0.3); overflow-y: auto;
    }

    #sideMenu.active { right: 0; }
    .menu-close { position: absolute; top: 15px; left: 15px; font-size: 24px; color: yellow; cursor: pointer; z-index: 3100; }
    .menu-header { text-align: center; margin-bottom: 20px; margin-top: 40px; }
    .menu-header h3 { margin: 0; font-size: 20px; }
    .menu-header p { margin: 5px 0; font-size: 14px; color: #ccc; }
    .vip-badge { display: inline-block; background-color: gold; color: black; padding: 4px 8px; border-radius: 5px; font-size: 12px; margin-top: 5px; }
    .balance-box { background-color: #fff; color: #000; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; }
    .menu-links { list-style: none; padding: 0; }
    .menu-links li { margin-bottom: 15px; }
    .menu-links a { display: flex; justify-content: space-between; align-items: center; direction: rtl; color: white; text-decoration: none; font-size: 16px; padding: 8px 12px; border-radius: 6px; transition: background-color 0.3s ease; }
    .menu-links a:hover { background-color: #5c0fa8; }
    .menu-links .icon i { font-size: 18px; color: yellow; }
    .menu-links .link-text { flex-grow: 1; text-align: right; }

    .social-row { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #ffffff33; }
    .social-row a { color: yellow; font-size: 1.2rem; transition: color 0.3s ease; }
    .social-row a:hover { color: #fff; }

    main { max-width: 1000px; margin: auto; padding: 20px; }

    h2 { text-align: center; font-size: 28px; margin-bottom: 20px; color: #ffd700; }

    .clear-btn { text-align: center; margin-bottom: 30px; }
    .clear-btn button { background-color: red; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; }

    .orders-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .order-card { background-color: #1a2f5e; border-radius: 10px; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.3); transition: transform 0.3s ease; }
    .order-card:hover { transform: scale(1.03); }
    .order-card h3 { margin: 0 0 10px; font-size: 20px; color: #fff; }
    .order-card .desc { color: #ccc; margin-bottom: 10px; }
    .order-card .price { color: #ffd700; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
    .order-card .number { color: white; font-size: 14px; }

    footer {
      background: linear-gradient(to right, purple, #00008b);
      padding: 20px 0;
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.3);
    }

    .footer-nav {
      display: flex;
      justify-content: center;
      gap: 100px;
      flex-wrap: wrap;
    }

    .footer-nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: transform 0.2s, color 0.2s;
    }
/* 
    .footer-nav a:hover {
      color: #ffd700;
      transform: translateY(-3px);
    } */

    .footer-nav a .icon {
      padding: 10px;
      border-radius: 50%;
      transition: background-color 0.3s;
    }

    .footer-nav a:hover .icon {
      background-color: purple;
    }
     .footer-nav .active .icon {
      background-color: purple;
    }

    .footer-nav a i {
      font-size: 20px;
      color: yellow;
    }

    .menu-links .active { background-color: #5c0fa8; }
  #pageLoader {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loader-wrapper {
  position: relative;
  width: 120px;
  height: 120px;
}

.loader-logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
}

.loader-ring {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border: 6px solid transparent;
  border-top: 6px solid #a29bfe;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  z-index: 1;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 768px) {
  #sideMenu {
    width: 280px; /* عرض ثابت */
    right: -280px; /* مخفية خارج الشاشة */
    transition: right 0.3s ease;
  }

  #sideMenu.active {
    right: 0; /* تظهر من اليمين */
  }

  body.menu-open {
    overflow: hidden; /* يمنع تمرير الصفحة أثناء فتح القائمة */
  }
}
.footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  max-width: 600px;
  width: 100%;
}

.footer-nav a {
  flex: 1;
  min-width: 0;
  text-align: center;
}
  </style>
</head>
<body>
<div id="pageLoader" style="display: none;">
  <div class="loader-wrapper">
    <div class="loader-ring"></div>
    <img src="../store_logo-removebg-preview (1).png" alt="Logo" class="loader-logo" />
  </div>
</div>
<header>
  <div class="header-content">
    <div class="logo">
      <img src="../store_logo-removebg-preview (1).png" alt="BrightShop Logo" />
    </div>

    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="بحث..." />
    </div>

    <div class="purchase-progress-container">
      <span>مشترياتك:</span>
      <div class="progress-bar">
        <div class="progress-fill" id="purchaseProgress"></div>
      </div>
      <span id="purchaseAmount">0$</span>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <i id="menuIcon" class="fas fa-bars"></i>
    </div>
  </div>
</header>

<div id="sideMenu">
  <div class="menu-close" onclick="toggleMenu()">
    <i class="fas fa-times"></i>
  </div>

  <div class="menu-header">
    <h3 id="usernameDisplay">مرحبا</h3>
    <p>ID:2121230</p>
    <span class="vip-badge">VIP RETAILER</span>
  </div>

  <div class="balance-box">
    <span>الرصيد: <strong id="balanceAmount">S.P 0.000</strong></span>
  </div>

  <ul class="menu-links">
    <li><a href="../home page/index.html"><span class="link-text">الرئيسية</span><span class="icon"><i class="fas fa-home"></i></span></a></li>
    <li><a href="../add balance section/addbala.html"><span class="link-text">إضافة رصيد</span><span class="icon"><i class="fas fa-plus-circle"></i></span></a></li>
    <li><a href="../payments/pay.html"><span class="link-text">دفعاتي</span><span class="icon"><i class="fas fa-credit-card"></i></span></a></li>
    <li><a href="../wallet/wallet.html"><span class="link-text">محفظتي</span><span class="icon"><i class="fas fa-wallet"></i></span></a></li>
    <li><a href="#" class="active"><span class="link-text">طلباتي</span><span class="icon"><i class="fas fa-list"></i></span></a></li>
    <li><a href="../wakeels/wakeel.html"><span class="link-text">وكلاؤنا</span><span class="icon"><i class="fas fa-users"></i></span></a></li>
    <li><a href="#"><span class="link-text">الحماية</span><span class="icon"><i class="fas fa-shield-alt"></i></span></a></li>
    <li><a href="#"><span class="link-text">من نحن</span><span class="icon"><i class="fas fa-info-circle"></i></span></a></li>
  </ul>

  <div class="social-row">
    <a href="https://t.me/yourchannel" target="_blank"><i class="fab fa-telegram"></i></a>
    <a href="https://facebook.com/yourpage" target="_blank"><i class="fab fa-facebook-f"></i></a>
    <a href="https://instagram.com/yourprofile" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://linkedin.com/in/yourprofile" target="_blank"><i class="fab fa-linkedin-in"></i></a>
  </div>
</div>

<main>
  <h2><i class="fas fa-list"></i> سجل الطلبات</h2>

  <div class="clear-btn">
    <button onclick="clearOrders()">مسح كل الطلبات</button>
  </div>

  <div class="orders-container" id="ordersList"></div>
</main>

<footer>
  <div class="footer-nav">
    <a href="../home page/index.html"><span class="icon"><i class="fas fa-home"></i></span> Home</a>
    <a href="../wallet/wallet.html"><span class="icon"><i class="fas fa-wallet"></i></span>wallet</a>
    <a href="../wallet/wallet.html"><span class="icon"><i class="fas fa-shopping-cart"></i></span>payments</a>
    <a href="#" class="active"><span class="icon"><i class="fas fa-list"></i></span>orders</a>
    <a href="../add balance section/addbala.html"><span class="icon"><i class="fas fa-plus-circle"></i></span>+ Balance</a>
  </div>
</footer>
  <script>
  // تحميل الرصيد من localStorage
  let userBalance = parseFloat(localStorage.getItem("userBalance")) || 801.866;
  const balanceDisplay = document.getElementById("balanceAmount");

  function updateBalanceDisplay() {
    balanceDisplay.textContent = "S.P " + userBalance.toFixed(3);
    localStorage.setItem("userBalance", userBalance);
  }

  updateBalanceDisplay();

  // عرض اسم المستخدم
  const savedName = localStorage.getItem("username") || "يوسف";
  const usernameDisplay = document.getElementById("usernameDisplay");
  if (usernameDisplay) {
    usernameDisplay.textContent = "مرحبا " + savedName;
  }

  // تحديث شريط المشتريات
  function updatePurchaseProgress() {
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    let totalSpent = 0;
    orders.forEach(order => {
      totalSpent += parseFloat(order.price.replace("$", ""));
    });

    const progressBar = document.getElementById("purchaseProgress");
    const purchaseAmount = document.getElementById("purchaseAmount");

    purchaseAmount.textContent = totalSpent.toFixed(2) + "$";

    let percent = (totalSpent / 1000) * 100;
    if (percent > 100) percent = 100;
    progressBar.style.width = percent + "%";
  }

  updatePurchaseProgress();

  // توليد الطلبات من localStorage
  const ordersList = document.getElementById("ordersList");
  const orders = JSON.parse(localStorage.getItem("orders")) || [];

  if (orders.length === 0) {
    ordersList.innerHTML = "<p style='text-align:center;'>لا يوجد طلبات حتى الآن.</p>";
  } else {
    orders.forEach(order => {
      const card = document.createElement("div");
      card.className = "order-card";
      card.innerHTML = `
        <h3>${order.name}</h3>
        <div class="desc">${order.desc}</div>
        <div class="price">السعر: ${order.price}</div>
        <div class="number">رقم التواصل: ${order.number}</div>
      `;
      ordersList.appendChild(card);
    });
  }

  // مسح كل الطلبات
  function clearOrders() {
    if (confirm("هل أنت متأكد أنك تريد مسح كل الطلبات؟")) {
      localStorage.removeItem("orders");
      location.reload();
    }
  }

  // القائمة الجانبية
  const sideMenu = document.getElementById("sideMenu");
  const menuIcon = document.getElementById("menuIcon");

  function toggleMenu() {
    sideMenu.classList.toggle("active");

    if (sideMenu.classList.contains("active")) {
      menuIcon.classList.remove("fa-bars");
      menuIcon.classList.add("fa-times");
    } else {
      menuIcon.classList.remove("fa-times");
      menuIcon.classList.add("fa-bars");
    }
  }






 const loader = document.getElementById("pageLoader");

document.querySelectorAll("a[href]").forEach(link => {
  link.addEventListener("click", function(e) {
    const href = this.getAttribute("href");
    if (!href || href.startsWith("#")) return;

    e.preventDefault();
    loader.style.display = "flex";

    setTimeout(() => {
      window.location.href = href;
    }, 500); // نصف ثانية
  });
});  
</script>

</body>
</html>
